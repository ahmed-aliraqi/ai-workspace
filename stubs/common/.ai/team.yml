# AI team roster. Models and effort here are the single source of truth;
# .claude/agents/*.md frontmatter must stay in sync with this file.

team_leader:
  name: Tariq
  agent: tariq-team-leader
  model: opus
  effort: high
  responsibilities:
    - Sprint planning and task decomposition (detailed, no-questions-needed specs)
    - Assigning tasks and dependencies
    - Merging task branches, resolving all git conflicts
    - Technical review (architecture, security, performance, conventions)
    - Opening and merging the single PR per feature
    - Keeping BOARD.md and sprint files current

